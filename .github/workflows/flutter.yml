name: flutter

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/sitedrop_core
          - buyer_app
          - seller_app
          - driver_app

    defaults:
      run:
        working-directory: apps/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d test ] && [ -n "$(find test -name '*.dart' -print -quit)" ]; then
            flutter test
          else
            echo "No tests in apps/${{ matrix.package }}"
          fi

      - name: Build Web (WASM)
        run: flutter build web --release --wasm

  backend-tests:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3]
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sitedrop_test
          MYSQL_USER: test
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure SQLite (if selected)
        if: matrix.db == 'sqlite'
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          touch database/database.sqlite

      - name: Configure MySQL (if selected)
        if: matrix.db == 'mysql'
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=sitedrop_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=test/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --parallel
        env:
          APP_ENV: testing