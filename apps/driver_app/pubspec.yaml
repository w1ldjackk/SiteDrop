name: sitedrop_driver
description: SiteDrop Driver — deliveries, trips, location.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  sitedrop_core:
    path: ../packages/sitedrop_core

  webview_flutter: ^4.4.2
  font_awesome_flutter: ^11.0.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  dio: ^5.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  tailwind_colors: ^0.3.1
  hive_flutter: ^1.1.0
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3
  toastification: ^3.2.0
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.2.0
  package_info_plus: ^10.2.0
  permission_handler: ^12.0.3
  logger: ^2.7.0
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  web: ^1.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
