name: sitedrop_core
description: >
  Shared SiteDrop Flutter package — API client, models, theme, constants, and
  utilities used by buyer / seller / driver apps. No screens or go_router trees.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & storage
  dio: ^5.9.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.2.0
  package_info_plus: ^10.2.0

  # Logging & UI utilities
  logger: ^2.7.0
  intl: ^0.20.2
  toastification: ^3.2.0
  form_builder_validators: ^11.3.0
  font_awesome_flutter: ^11.0.0
  tailwind_colors: ^0.3.1

  # Location / maps (shared address + driver location)
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  permission_handler: ^12.0.3

  # Media
  image_picker: ^1.2.2
  image_cropper: ^12.2.1

  # Push — pin exact versions (16.4.2 expects FirebasePlugin not yet published)
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # Apps provide their own asset bundles. Prefer package assets only when
  # truly shared, then load with: AssetImage('…', package: 'sitedrop_core').
